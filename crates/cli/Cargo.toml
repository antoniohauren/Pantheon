[package]
name = "pantheon-cli"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Bare binary names (D17); per-god mains are thin (P11).
[[bin]]
name = "pantheon"
path = "src/bin/pantheon.rs"

[[bin]]
name = "athena"
path = "src/bin/athena.rs"

[[bin]]
name = "hades"
path = "src/bin/hades.rs"

[[bin]]
name = "hermes"
path = "src/bin/hermes.rs"

[[bin]]
name = "proteus"
path = "src/bin/proteus.rs"

[dependencies]
athena = { path = "../athena" }
hades = { path = "../hades" }
hermes = { path = "../hermes" }
pantheon-args = { path = "../args" }
proteus = { path = "../proteus" }

[lints]
workspace = true
