name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Skipped gates
        shell: bash
        run: |
          {
            echo "### Skipped gates"
            echo "- \`cargo xtask deps --core\`: not implemented until Phase 1"
            echo "- GTK clippy + GUI/console build job: no GUI or console crates yet"
          } >> "$GITHUB_STEP_SUMMARY"
